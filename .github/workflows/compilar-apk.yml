name: Compilar Santo Antojo APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar proyecto
        run: |
          test -f SantoAntojo_1.4_Actualizable_Proyecto.zip || { echo 'Falta subir el ZIP seguro de la versión 1.4'; exit 1; }
          unzip -Z1 SantoAntojo_1.4_Actualizable_Proyecto.zip | grep -q 'SantoAntojoAndroid/app/build.gradle'
          mkdir -p source
          unzip -q SantoAntojo_1.4_Actualizable_Proyecto.zip -d source
          test -f source/SantoAntojoAndroid/app/build.gradle
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Cargar firma original de forma privada
        env:
          KEYSTORE_BASE64: ${{ secrets.SANTO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Falta el secreto SANTO_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/santo-antojo.p12"
          chmod 600 "$RUNNER_TEMP/santo-antojo.p12"
      - name: Compilar APK release firmada
        working-directory: source/SantoAntojoAndroid
        env:
          SANTO_KEYSTORE_FILE: ${{ runner.temp }}/santo-antojo.p12
          SANTO_KEYSTORE_PASSWORD: ${{ secrets.SANTO_KEYSTORE_PASSWORD }}
          SANTO_KEY_ALIAS: ${{ secrets.SANTO_KEY_ALIAS }}
          SANTO_KEY_PASSWORD: ${{ secrets.SANTO_KEY_PASSWORD }}
        run: |
          test -n "$SANTO_KEYSTORE_PASSWORD"
          test -n "$SANTO_KEY_ALIAS"
          test -n "$SANTO_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
      - name: Preparar descarga y metadatos
        id: release
        working-directory: source/SantoAntojoAndroid
        run: python3 .github/scripts/make_release.py
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Santo Antojo ${{ steps.release.outputs.version }}
          files: |
            source/SantoAntojoAndroid/release/SantoAntojo.apk
            source/SantoAntojoAndroid/release/update.json
