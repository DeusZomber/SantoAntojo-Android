name: Compilar Santo Antojo APK
on:
  push:
    paths:
      - 'SantoAntojo_1.4_Actualizable_Proyecto*.zip'
      - '.github/workflows/compilar-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Localizar ZIP subido
        shell: bash
        run: |
          shopt -s nullglob
          files=(SantoAntojo_1.4_Actualizable_Proyecto*.zip)
          if (( ${#files[@]} != 1 )); then
            echo "Se esperaba un solo archivo SantoAntojo_1.4_Actualizable_Proyecto*.zip; encontrados: ${#files[@]}"
            exit 1
          fi
          mkdir -p source
          unzip -q "${files[0]}" -d source
          test -f source/SantoAntojoAndroid/app/build.gradle
          test -f source/SantoAntojoAndroid/.github/scripts/make_release.py
          # La APK se distribuye fuera de Play Store. Mantener compatibilidad
          # mientras se migra targetSdk en una versión futura.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("source/SantoAntojoAndroid/app/build.gradle")
          s=p.read_text()
          anchor="    compileSdk 35\n"
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,anchor+"    lint { disable 'ExpiredTargetSdkVersion' }\n"))
          PY
          if find source -type f \( -iname '*.p12' -o -iname '*.jks' -o -iname '*.keystore' \) | grep -q .; then
            echo 'Por seguridad, el ZIP no debe incluir archivos privados de firma.'
            exit 1
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
      - name: SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar versión de prueba (validar código)
        working-directory: source/SantoAntojoAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Guardar resultado técnico de verificación (NO actualizar app instalada)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: comprobacion-android-no-es-actualizacion
          path: source/SantoAntojoAndroid/app/build/outputs/apk/debug/app-debug.apk
      - name: Preparar APK release sin firma para firmarla de forma privada
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("source/SantoAntojoAndroid/app/build.gradle")
          source=path.read_text()
          signing="            if (keyStorePath != null && keyStorePassword != null && keyPassword != null && keyAliasName != null)\n                signingConfig signingConfigs.original\n"
          assert source.count(signing)==1, "Configuración de firma inesperada"
          source=source.replace(signing,"")
          guard="// Never produce an unsigned release"
          assert source.count(guard)==1
          source=source.split(guard)[0]
          path.write_text(source)
          PY
      - name: Compilar release SIN FIRMA (no instalar)
        if: github.event_name == 'push'
        working-directory: source/SantoAntojoAndroid
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Preparar herramientas de firma local
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p unsigned-delivery
          cp source/SantoAntojoAndroid/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-delivery/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" unsigned-delivery/
      - name: Guardar APK SIN FIRMA y herramienta de firma
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-sin-firma-firmar-en-privado
          path: unsigned-delivery/*
      - name: Restaurar firma ORIGINAL solo para APK actualizable
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.SANTO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SANTO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SANTO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SANTO_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Faltan los 4 secretos de firma Android en Settings > Secrets and variables > Actions.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/santo-antojo.p12"
          chmod 600 "$RUNNER_TEMP/santo-antojo.p12"
      - name: Compilar APK actualizable firmada
        if: github.event_name == 'workflow_dispatch'
        working-directory: source/SantoAntojoAndroid
        env:
          SANTO_KEYSTORE_FILE: ${{ runner.temp }}/santo-antojo.p12
          SANTO_KEYSTORE_PASSWORD: ${{ secrets.SANTO_KEYSTORE_PASSWORD }}
          SANTO_KEY_ALIAS: ${{ secrets.SANTO_KEY_ALIAS }}
          SANTO_KEY_PASSWORD: ${{ secrets.SANTO_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Generar archivo de actualización
        if: github.event_name == 'workflow_dispatch'
        id: release
        working-directory: source/SantoAntojoAndroid
        run: python3 .github/scripts/make_release.py
      - name: Publicar APK firmada
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Santo Antojo ${{ steps.release.outputs.version }}
          files: |
            source/SantoAntojoAndroid/release/SantoAntojo.apk
            source/SantoAntojoAndroid/release/update.json
