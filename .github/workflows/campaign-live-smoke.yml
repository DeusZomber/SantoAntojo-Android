name: Probar HTTPS y acceso privado de Santo Antojo
on:
  pull_request:
    paths:
      - 'server/scripts/live-smoke.mjs'
      - '.github/workflows/campaign-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar HTTPS y autenticacion sin credenciales ni publicaciones
        run: node server/scripts/live-smoke.mjs
