name: Instalar fotografias HD para Santo Antojo
on:
  push:
    paths:
      - '.github/workflows/preparar-fotos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos-hd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotografia original de alta resolucion
        env:
          SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/92348909-1f95-43cc-b7b4-eeba60c19e90.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjEwOWU5MzFmOGE2ODg5YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDAxNjE3N30.VsmF2lhhte9fgqK55EcXvwLKOaUt21PnJqYY26lWAuI"
        run: |
          mkdir -p pedidos-web/assets
          curl --fail --location --retry 4 --retry-delay 2 --max-time 180 "$SOURCE_URL" --output pedidos-web/assets/catalogo-hd.webp
      - name: Crear fotos HD individuales (sin estirar)
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          base=Path('pedidos-web/assets')
          img=Image.open(base/'catalogo-hd.webp').convert('RGB')
          assert img.size == (3000,2100),f'Atlas inesperado: {img.size}'
          (base/'productos').mkdir(parents=True,exist_ok=True)
          (base/'ingredientes').mkdir(parents=True,exist_ok=True)
          names=['f8','f16','f32','divina','jamon','pizza','matcha','capu','oreo','espagui']
          for i,n in enumerate(names):
              x=(i%5)*600;y=(i//5)*600
              im=img.crop((x,y,x+600,y+600))
              im.save(base/'productos'/(n+'.webp'),'WEBP',quality=91,method=6)
          for i in range(29):
              x=(i%10)*300;y=1200+(i//10)*300
              im=img.crop((x,y,x+300,y+300))
              im.save(base/'ingredientes'/(str(i)+'.webp'),'WEBP',quality=90,method=6)
          assert all((base/'productos'/(n+'.webp')).stat().st_size>15000 for n in names)
          assert all((base/'ingredientes'/(str(i)+'.webp')).stat().st_size>2500 for i in range(29))
          print('10 fotos 600x600 y 29 fotos 300x300 preparadas')
          PY
      - name: Guardar fotografias permanentes en la web
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pedidos-web/assets
          if ! git diff --cached --quiet; then
            git commit -m "Integrar fotografias HD originales de productos e ingredientes"
            git push
          fi
