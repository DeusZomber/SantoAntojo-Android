name: Verificar servidor Santo Antojo sin publicar
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/campaign-server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas de borradores sin redes sociales
        working-directory: server
        run: npm test
